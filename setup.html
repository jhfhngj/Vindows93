<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Windows 93 Setup</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: linear-gradient(135deg, #000080, #1084d7);
            font-family: 'MS Sans Serif', Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        
        .setup-window {
            background: #c0c0c0;
            border: 2px solid;
            border-color: #dfdfdf #808080 #808080 #dfdfdf;
            width: 500px;
            box-shadow: 1px 1px 0 #ffffff inset, 1px 1px 0 #000000;
        }
        
        .title-bar {
            background: linear-gradient(90deg, #000080, #1084d7);
            color: white;
            padding: 2px 2px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .title-bar h1 {
            font-size: 14px;
            font-weight: bold;
        }
        
        .content {
            padding: 20px;
            line-height: 1.6;
        }
        
        .buttons {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            padding: 10px 20px;
            background: #c0c0c0;
            border-top: 1px solid #dfdfdf;
        }
        
        button {
            padding: 4px 12px;
            background: #c0c0c0;
            border: 2px solid;
            border-color: #dfdfdf #808080 #808080 #dfdfdf;
            font-family: 'MS Sans Serif', Arial;
            cursor: pointer;
        }
        
        button:active {
            border-color: #808080 #dfdfdf #dfdfdf #808080;
        }
    </style>
</head>
<body>
    <div class="setup-window">
        <div class="title-bar">
            <h1>Vindows93 Setup</h1>
        </div>
        <div class="content">
            <p>Welcome to Vindows93 Setup!</p>
            <p>Click Next to continue with the installation process. (The patcher isn't working sorry so this setup is basically aesthetic only or wait until patcher is fixed except the part where it creates the Vindows93 OS)</p>
        </div>
        <div class="buttons">
            <button>Cancel</button>
            <button id="setup">Next ></button>
        </div>
        <script>
            const startSetup = document.getElementById("setup");
            const content = document.getElementsByClassName("content")[0];

            let step = 0;
            let username = "";
            let hostAccess = "";

            function setContent(html) {
                content.innerHTML = html;
            }

            startSetup.onclick = function () {
                // Read previous step's values BEFORE changing content
                if (step === 1) {
                    const input = document.getElementById("Ahs");
                    if (input) username = input.value || "windows93";
                }

                if (step === 2) {
                    const input = document.getElementById("IAo");
                    if (input) hostAccess = input.value || "N";
                }

                // Advance step
                step += 1;

                // Render current step
                if (step === 1) {
                    setContent(`
                        <p>Enter username for Vindows93's Windows93 patcher to use.</p>
                        <input placeholder="windows93" id="Ahs">
                    `);
                } else if (step === 2) {
                    setContent(`
                        <p>Would you like access to the host's computer's files whilst you use Windows93? (Y/N)</p>
                        <input id="IAo">
                    `);
                } else if (step === 3) {
                    setContent(`<p>Press Next to generate your patch configuration.</p>`);
                } else if (step === 4) {
                    const data = `${username};${hostAccess}`;
                    const blob = new Blob([data], { type: "text/plain" });
                    const url = URL.createObjectURL(blob);

                    const a = document.createElement("a");
                    a.href = url;
                    a.download = "patchStuff";
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    URL.revokeObjectURL(url);

                    setContent(`<p>Configuration saved! To patch, install Python then run patch.py.</p>`);
                    startSetup.disabled = true;
                }
            };
            </script>
    </div>
</body>
</html>
